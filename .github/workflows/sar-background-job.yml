name: SAR Background Job

# พอร์ตจาก run_sar_background_job.bat (Windows Task Scheduler, ทุกวันจันทร์ 03:00 ICT)
# รัน sar_background_job.py -- เช็คว่ามีภาพ Sentinel-1 ใหม่หรือยัง (check_new_sar_image(),
# มี min_days_between_runs=30 กันไว้อีกชั้น) รันบ่อยกว่ารอบจริงไม่เสียหาย แค่เช็คแล้วข้าม
#
# ⚠️ ต้องตั้ง GitHub Secrets 2 ตัวก่อน workflow นี้จะรันผ่านจริง (ไม่งั้นจะ fallback ไป
# ee.Authenticate() แบบ interactive ซึ่งใช้ไม่ได้บน runner ที่ไม่มีคนคอย login -- จะ error/ค้าง):
#   - GEE_SERVICE_ACCOUNT_EMAIL       : service account email (xxx@xxx.iam.gserviceaccount.com)
#   - GEE_SERVICE_ACCOUNT_KEY_JSON    : เนื้อหาไฟล์ .json key ทั้งไฟล์ (แปะทั้งก้อนเป็น secret ได้เลย)
# Service Account นี้ตั้งค่าไว้แล้วจริงบนเครื่อง Windows (ยืนยันทำงานได้ตั้งแต่ 2026-07-22 ผ่าน
# chirps_feature.py ซึ่งใช้ gee_auth.py ตัวเดียวกับ sar_classification.py) -- แค่ต้องเอาเนื้อหาไฟล์
# .json key (อยู่นอก repo นี้บนเครื่อง Windows ตามคำแนะนำใน gee_auth.py -- ห้าม commit เข้า git)
# ไปแปะเป็น GitHub secret เอง (Settings -> Secrets and variables -> Actions -> New repository
# secret) **ไม่ต้องส่งเนื้อหาไฟล์ key นี้มาที่แชท** ตั้งในหน้า GitHub โดยตรงเลย
#
# Dependency: เต็มรูปแบบตาม requirements.txt เดิม (numpy, pandas, joblib, scikit-learn,
# geopandas, rasterio, earthengine-api, scipy, openpyxl) -- ใช้ตัวเดียวกับที่ data_pipeline.py
# ใช้อยู่แล้ว รันแค่สัปดาห์ละครั้งจึงไม่ต้องแยกลิสต์ให้ minimal เหมือน 2 workflow อื่น
#
# หมายเหตุ: run_sar_background_job.bat เดิมไม่มีขั้นตอน push git เลย (สคริปต์เขียนผลลัพธ์
# sar_result_latest.json / sar_result_<year>_<date>.json ไว้ที่ 01_data/gis/sar_output/ บนดิสก์
# เท่านั้น) workflow นี้เพิ่มขั้นตอน push ให้ (เดิมไม่เคยขึ้น GitHub จากเครื่อง Windows เลย) --
# ถ้าไม่ต้องการ push จริง (เช่น sar_output/ ไม่ได้ใช้ที่อื่นในเว็บ) แจ้งได้ จะตัดขั้นตอนนี้ออก

on:
  workflow_dispatch: {}
  schedule:
    # 20:00 UTC วันอาทิตย์ = 03:00 ICT วันจันทร์ (UTC+7)
    - cron: "0 20 * * 0"

permissions:
  contents: write

concurrency:
  group: sar-background-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # เดิมตั้งไว้ 2 ชม.บน Windows Task Scheduler เหมือนกัน (export+download GEE อาจนาน)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # numpy==2.5.0 ใน requirements.txt ต้องการ Python >=3.12 (3.11 resolve ไม่ได้ --
          # เจอจริงตอนทดสอบรอบแรก error "No matching distribution found for numpy==2.5.0")
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "01_data/scripts and code/pipeline/requirements.txt"

      - name: pip install dependencies (ชุดเดียวกับ data_pipeline.py)
        run: pip install -r "01_data/scripts and code/pipeline/requirements.txt"

      - name: เขียน GEE service account key ลงไฟล์ชั่วคราว
        run: |
          cat > /tmp/gee-key.json <<'EOF'
          ${{ secrets.GEE_SERVICE_ACCOUNT_KEY_JSON }}
          EOF

      - name: Run sar_background_job.py
        working-directory: 01_data/scripts and code/pipeline
        env:
          GEE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GEE_SERVICE_ACCOUNT_EMAIL }}
          GEE_SERVICE_ACCOUNT_KEY: /tmp/gee-key.json
        run: python sar_background_job.py

      - name: ลบไฟล์ key ชั่วคราวทิ้ง (กันหลงเหลือใน runner)
        if: always()
        run: rm -f /tmp/gee-key.json

      # 2026-09-07 เอาขั้นตอน push ออก -- 01_data/gis/sar_output/ อยู่ใน .gitignore ตั้งใจไว้แล้ว
      # (runtime artifact, regenerable, ไม่ควร commit -- ดู comment ใน .gitignore บรรทัด 5-9) ทดสอบ
      # จริงแล้วพบว่า git add ล้มเหลวเพราะเหตุนี้ (ไม่ใช่บั๊ก workflow)
      #
      # ที่สำคัญกว่านั้น: ผลลัพธ์ไฟล์นี้เป็น feature จริงที่ data_pipeline_colab.py อ่านใช้ (crop
      # classification) แต่ Colab เห็นข้อมูลจาก Windows ผ่าน sync_to_drive.bat (Google Drive sync)
      # ไม่ใช่ผ่าน git เลย (ยืนยันจาก DAILY_RUNBOOK.md บรรทัด 210) -- ตอนนี้ยังไม่กระทบอะไรเพราะ
      # Windows ยังรัน sar_background_job.py ขนานอยู่ (shadow mode) sync_to_drive.bat ยังทำงานปกติ
      # ผลลัพธ์รอบนี้ (จาก GitHub Actions) จึงยังไม่มีใครอ่านจริง -- แค่พิสูจน์ว่าสคริปต์รันได้จริงบน
      # Actions (pip install + GEE Service Account auth + sar_background_job.py เอง ผ่านหมดแล้ว)
      # ถ้าจะให้ผลลัพธ์รอบนี้มีประโยชน์จริง (เช่นตอนย้าย main pipeline ไป Actions ด้วย) ต้องตัดสินใจ
      # เรื่อง data bridge ไป Colab ใหม่ก่อน (push เข้า git แล้วให้ Colab git pull แทน Drive sync,
      # หรือทางอื่น) -- ยังไม่ทำตอนนี้ รอคุยกับผู้ใช้ก่อน
      - name: ผลลัพธ์ SAR (ไม่ push -- ดู comment ด้านบน)
        run: echo "[INFO] sar_background_job.py รันสำเร็จ -- ผลลัพธ์อยู่ใน runner นี้เท่านั้น (ephemeral, ไม่ push) ตามที่ตกลงไว้"
