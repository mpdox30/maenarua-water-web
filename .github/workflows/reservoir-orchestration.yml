name: Reservoir Daily Orchestration

# พอร์ตจาก run_reservoir_daily_orchestration.bat (Windows Task Scheduler, ทุกวัน 07:30 ICT)
# รัน reservoir_daily_orchestration.py -- คำนวณของ "เมื่อวาน" เสมอ, เขียนทั้ง shadow CSV
# (RES002_daily_computed.csv) และไฟล์ทางการรายเดือน (inflow/<year>/<year>_<month>_MNR.xlsx)
# แล้ว push ทั้งคู่ขึ้น GitHub -- pattern เดียวกับ .bat ต้นฉบับทุกจุด (pull --no-rebase ก่อน
# push, add เฉพาะไฟล์ที่รู้จัก, commit เฉพาะตอนมีอะไรเปลี่ยนจริง)
#
# Dependency: openpyxl เท่านั้น (สคริปต์นี้ + module ที่ import ทั้งหมด --
# reservoir_telemetry_from_sheet.py, reservoir_water_balance.py -- เป็น stdlib ล้วน
# ยืนยันด้วย import grep แล้ว)
#
# หมายเหตุ: เครื่อง Windows ยังรัน .bat ตัวเดิมขนานกันอยู่ (shadow mode ตามที่ตกลงกันไว้ --
# ยกเลิกเมื่อ GitHub Actions พิสูจน์แล้วว่าใช้งานได้สมบูรณ์) ถ้า workflow นี้ push ข้อมูลที่คำนวณ
# จากแหล่งเดียวกันเหมือน Windows จะได้ผลเหมือนกันเป๊ะ -- ปกติจะจบด้วย "ไม่มีอะไรเปลี่ยน ข้าม commit"
# ในฝั่งที่รันทีหลัง ไม่ใช่ conflict

# 2026-09-12 ปิด schedule ถาวร (ตัดสินใจร่วมกับผู้ใช้ -- ย้ายกลับไปใช้กระบวนการเดิมทั้งหมด: Windows
# Task Scheduler + sync_to_drive.bat + Colab notebook) -- ยืนยันจริงจาก GitHub API ว่า cron รายวันนี้
# แทบไม่เคยรันอัตโนมัติตรงรอบเลย (พบแค่ 1 ครั้งใน run history ทั้งหมด และดีเลย์ไปเกือบ 4.5 ชม.) ไม่ใช่
# ตัวเลือกที่เชื่อถือได้สำหรับงานรายวัน -- run_reservoir_daily_orchestration.bat บน Windows
# (GIT_PUSH_ENABLED=1 อยู่แล้ว) เป็นฐานหลักต่อไป เหลือ workflow_dispatch ไว้กดรันมือได้เท่านั้น
on:
  workflow_dispatch: {}
  # schedule:
  #   # 00:30 UTC = 07:30 ICT (UTC+7) -- เวลาเดียวกับ Windows Task Scheduler เดิม
  #   # หมายเหตุ: GitHub ไม่การันตีว่าจะรันตรงเวลาเป๊ะ อาจดีเลย์ได้โดยเฉพาะช่วงโหลดสูง
  #   - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  group: reservoir-orchestration
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: pip install dependencies
        run: pip install openpyxl==3.1.5

      # 2026-09-07 เพิ่ม -- กัน silent fallback ไปใช้ release_events.csv local (placeholder เก่า
      # ครอบคลุมช่วงกว้าง 26 มิ.ย.-14 ต.ค. 2569 แบบเหมารวม ไม่ใช่ log เหตุการณ์จริง) เกิดขึ้นจริงมาแล้ว
      # 2026-09-07: workflow นี้รันโดยไม่มี secret RESERVOIR_RELEASE_SHEET_CSV_URL ตั้งไว้ -- สคริปต์
      # เลย fallback ไปเจอ event ปลอมที่ครอบคลุมวันนั้นพอดี ได้ inflow ผิดไปเกือบ 24 เท่า (405 -> 9,851
      # m3/day) แล้ว push ทับทั้ง shadow CSV และไฟล์ทางการแบบเงียบๆ ไม่มี error ให้เห็นเลย (ดู commit
      # b2c35f7 ที่แก้กลับ) -- ด่านนี้ทำให้ job fail ทันทีชัดเจนแทน ถ้า secret ว่าง จะได้ไม่เกิดซ้ำอีก
      # ไม่ว่าใครจะลืมตั้ง secret ตอนไหนก็ตาม
      - name: ตรวจสอบว่ามี secret RESERVOIR_RELEASE_SHEET_CSV_URL ครบก่อนรัน (กัน silent fallback)
        run: |
          if [ -z "${{ secrets.RESERVOIR_RELEASE_SHEET_CSV_URL }}" ]; then
            echo "::error::ไม่ได้ตั้ง secret RESERVOIR_RELEASE_SHEET_CSV_URL -- ถ้าปล่อยรันต่อ reservoir_daily_orchestration.py จะ fallback ไปอ่าน release_events.csv local (placeholder เก่า ครอบคลุม 26 มิ.ย.-14 ต.ค. 2569 แบบเหมารวม ไม่ใช่ log เหตุการณ์จริง) แล้วคำนวณ inflow ผิดแบบเงียบๆ (เคยเกิดจริง 2026-09-07 ดู commit b2c35f7) -- ไปตั้ง secret นี้ที่ Settings > Secrets and variables > Actions ก่อน ใช้ค่าเดียวกับ env var RESERVOIR_RELEASE_SHEET_CSV_URL บนเครื่อง Windows"
            exit 1
          fi

      - name: Run reservoir_daily_orchestration.py
        working-directory: 01_data/scripts and code/pipeline
        env:
          RESERVOIR_TELEMETRY_SHEET_CSV_URL: ${{ secrets.RESERVOIR_TELEMETRY_SHEET_CSV_URL }}
          RESERVOIR_RELEASE_SHEET_CSV_URL: ${{ secrets.RESERVOIR_RELEASE_SHEET_CSV_URL }}
        run: python reservoir_daily_orchestration.py

      - name: Sync กับ remote ก่อน push (merge จริง ไม่ใช่ ff-only -- pattern เดียวกับ .bat)
        run: git pull --no-rebase --no-edit origin master

      - name: Commit + push ไฟล์ทางการ + shadow CSV ถ้ามีอะไรเปลี่ยนจริง
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "01_data/Reservoirs/inflow/"
          git add "01_data/Reservoirs/inflow_auto/RES002_daily_computed.csv"
          if git diff --cached --quiet; then
            echo "[INFO] ไม่มีอะไรเปลี่ยนจากรอบก่อน -- ข้ามการ commit/push"
          else
            git commit -m "Auto-update (GitHub Actions): reservoir official file + shadow CSV"
            git push origin master
          fi
